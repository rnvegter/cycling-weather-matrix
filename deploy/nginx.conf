# nginx — use this if nginx is already what you run. Caddy needs less of it.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/cycling-weather-matrix
#   sudo ln -s /etc/nginx/sites-available/cycling-weather-matrix /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kit.example.com     # fills in the TLS block below

# Lookups are rate limited in the Node process too; this stops abusive traffic
# before it ever gets that far.
limit_req_zone $binary_remote_addr zone=cwem_lookup:10m rate=12r/m;

server {
	listen 80;
	listen [::]:80;
	server_name kit.example.com;
	# certbot rewrites this to a 301 to HTTPS once a certificate exists.

	access_log /var/log/nginx/cwem.access.log;
	error_log  /var/log/nginx/cwem.error.log;

	gzip on;
	gzip_types text/css application/javascript text/html application/json;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# The lookup fetches two or three upstream pages, so it needs a long
	# read timeout. The default 60s would cut a slow one off.
	location /api/ {
		limit_req zone=cwem_lookup burst=5 nodelay;
		proxy_pass http://127.0.0.1:8765;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 90s;
	}

	location / {
		proxy_pass http://127.0.0.1:8765;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
